name: BIST Bot

on:
  schedule:
    # Bot 7/24 kapanmadan çalışır (gündüz BIST, BIST kapalıyken kripto).
    # Yarım saatlik yedek tetik: döngü bir sebeple durursa yeniden başlatır (çalışıyorsa sırada bekler).
    - cron: "7,37 * * * *"
  workflow_dispatch:      # Actions sekmesinden elle "Run workflow" ile de çalışır
    inputs:
      gorev:
        description: "dongu = seans boyunca çalış, otomatik = tek kontrol, sabah = sabah planını şimdi gönder, deneme = deneme planı"
        default: dongu
        type: choice
        options: [dongu, otomatik, sabah, deneme, kripto_deneme]
      mesaj:
        description: "Bota yazılmış gibi işlenecek mesaj (ör. YKBNK 1259 lot 38,10 aldım)"
        required: false
        default: ""
      nakit:
        description: "İstersen Midas serbest bakiyeni yaz (ör. 53000)"
        required: false
        default: ""

concurrency:
  group: bist-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneler
        run: pip install -r requirements.txt

      - name: Git ayarı
        run: |
          git config user.name "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN_ }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOREV: ${{ github.event.inputs.gorev || 'dongu' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAKIT: ${{ github.event.inputs.nakit || '' }}
          MESAJ: ${{ github.event.inputs.mesaj || '' }}
        run: python run_once.py

      - name: Durumu kaydet
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN_ }}
        run: python -c "import run_once; run_once.save_state()"
