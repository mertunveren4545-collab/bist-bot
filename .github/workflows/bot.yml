name: BIST Bot

on:
  schedule:
    # Hafta içi her 15 dakikada bir, 09:00-18:59 İstanbul saati (UTC 06-15)
    - cron: "*/15 6-15 * * 1-5"
  workflow_dispatch:      # Actions sekmesinden elle "Run workflow" ile de çalışır
    inputs:
      gorev:
        description: "otomatik = saate göre normal çalışma, deneme = şimdi deneme sabah planı gönder"
        default: otomatik
        type: choice
        options: [otomatik, deneme]
      nakit:
        description: "İstersen Midas serbest bakiyeni yaz (ör. 53000)"
        required: false
        default: ""

concurrency:
  group: bist-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneler
        run: pip install -r requirements.txt

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN_ }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOREV: ${{ github.event.inputs.gorev || 'otomatik' }}
          NAKIT: ${{ github.event.inputs.nakit || '' }}
        run: python run_once.py

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"
          git add -f data/bot.db
          git diff --cached --quiet || git commit -m "bot durumu $(date -u +%H:%M) [skip ci]"
          git pull --rebase -X ours -q || true
          git push -q || true
