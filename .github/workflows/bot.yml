name: BIST Bot

on:
  schedule:
    # Hafta içi sabah başlatır; bot seans boyunca kapanmadan çalışır.
    # Saatlik yedek tetik: döngü bir sebeple durursa yeniden başlatır (zaten çalışıyorsa sırada bekler).
    - cron: "40 6 * * 1-5"
    - cron: "5 7-15 * * 1-5"
  workflow_dispatch:      # Actions sekmesinden elle "Run workflow" ile de çalışır
    inputs:
      gorev:
        description: "dongu = seans boyunca çalış, otomatik = tek kontrol, sabah = sabah planını şimdi gönder, deneme = deneme planı"
        default: dongu
        type: choice
        options: [dongu, otomatik, sabah, deneme]
      nakit:
        description: "İstersen Midas serbest bakiyeni yaz (ör. 53000)"
        required: false
        default: ""

concurrency:
  group: bist-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Kütüphaneler
        run: pip install -r requirements.txt

      - name: Git ayarı
        run: |
          git config user.name "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"

      - name: Botu çalıştır
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN_ }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOREV: ${{ github.event.inputs.gorev || 'dongu' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAKIT: ${{ github.event.inputs.nakit || '' }}
        run: python run_once.py

      - name: Durumu kaydet
        if: always()
        run: |
          git config user.name "bist-bot"
          git config user.email "bist-bot@users.noreply.github.com"
          git add -f data/bot.db
          git diff --cached --quiet || git commit -m "bot durumu $(date -u +%H:%M) [skip ci]"
          git pull --rebase -X theirs -q || true
          git push -q || true
